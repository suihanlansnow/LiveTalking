###############################################################################
#  LiveTalking Configuration
#  CLI arguments override values in this file
###############################################################################

# -------- Audio ----------------------------------------------------------
l: 10
m: 8
r: 10

# -------- Avatar Model ----------------------------------------------------------
model: wav2lip                 # musetalk / wav2lip / ultralight
avatar_id: wav2lip256_avatar1_motion
batch_size: 8

# -------- Custom Actions ----------------------------------------------------------
customvideo_config: ''

# -------- TTS ----------------------------------------------------------
tts: kokoro                    # edgetts / piper / gpt-sovits / cosyvoice / kokoro / fishtts / tencent / doubao / indextts2 / azuretts / qwentts
REF_FILE: 'zf_001'             # 音色：kokoro 用音色名(zf_001等) / 其它引擎用参考音频路径
REF_TEXT: ''                   # reference text for voice cloning (English or Chinese)
TTS_SERVER: 'http://127.0.0.1:9881'  # TTS server URL, no trailing slash

# -------- LLM ----------------------------------------------------------
llm_provider: ollama           # dashscope / orcarouter / ollama
llm_model: 'qwen2.5:3b'        # model override, empty = provider default (qwen-plus / orcarouter/auto / qwen2.5:3b)

# -------- Transport ----------------------------------------------------------
transport: webrtc              # rtcpush / webrtc / rtmp / virtualcam
stun: 'stun:stun.freeswitch.org:3478'  # stun server URL
push_url: ''                   # push URL for rtcpush/rtmp (not needed for webrtc/virtualcam)
max_session: 5                 # max concurrent sessions
listenport: 8010
